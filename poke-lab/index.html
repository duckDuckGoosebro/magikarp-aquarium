<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Poké Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --font: 'Press Start 2P', ui-monospace, Menlo, Consolas, monospace; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; font-family: var(--font); }
  canvas#c { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; image-rendering: crisp-edges; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .14s; z-index: 6; }
  #banner { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; background: #5a78c8; color: #fff; border: 3px solid #f8f8f8; outline: 3px solid #303860;
            border-radius: 6px; padding: 8px 12px; font-size: 12px; letter-spacing: 1px; z-index: 5; transform: translateY(-140%); transition: transform .3s; }
  #banner.show { transform: none; }
  #msg { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(620px, calc(100vw - 28px)); box-sizing: border-box; min-height: 74px;
         background: #f8f8f8; border: 4px solid #5a6ec0; outline: 3px solid #283058; border-radius: 8px; padding: 14px 16px; font-size: 12px; line-height: 1.8; color: #303030;
         white-space: pre-line; display: none; z-index: 5; }
  #msg i { position: absolute; right: 12px; bottom: 6px; font-style: normal; color: #d04040; animation: bl .7s steps(2) infinite; }
  @keyframes bl { 50% { opacity: 0; } }
  #hud { position: fixed; top: 10px; right: 10px; font-size: 9px; color: #fff; text-shadow: 1px 1px 0 #000; z-index: 4; text-align: right; line-height: 1.7; pointer-events: none; }
  #pad { position: fixed; left: 14px; bottom: 14px; width: 168px; height: 168px; display: none; z-index: 4; }
  #pad button, .gb { position: absolute; width: 56px; height: 56px; border-radius: 12px; border: 3px solid #fff9; background: #0007; color: #fff; font: 16px var(--font); touch-action: none; padding: 0; }
  #pad .u { left: 56px; top: 0 } #pad .d { left: 56px; top: 112px } #pad .l { left: 0; top: 56px } #pad .r { left: 112px; top: 56px }
  #abtn { right: 18px; bottom: 56px; width: 70px; height: 70px; border-radius: 50%; position: fixed; display: none; z-index: 4; }
  #mbtn { right: 18px; bottom: 140px; width: 70px; height: 40px; border-radius: 10px; font-size: 10px; position: fixed; display: none; z-index: 4; }
  @media (pointer: coarse) { #pad, #abtn, #mbtn { display: block; } body.talk #pad { opacity: .5; } #msg { bottom: 196px; } }
  #wm { position: fixed; inset: 0; background: #1c2840f2; display: none; z-index: 7; align-items: center; justify-content: center; flex-direction: column; color: #fff; }
  #wm canvas { width: min(96vw, 1056px, calc((100vh - 60px) * 1.571)); height: auto; image-rendering: pixelated; border: 4px solid #f8f8f8; outline: 3px solid #283058; }
  #wm p { font-size: 10px; margin: 10px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fade"></div>
<div id="banner"></div>
<div id="msg"></div>
<div id="hud"></div>
<div id="wm"><canvas id="wmc" width="1056" height="672"></canvas><p>M / tap to close</p></div>
<div id="pad"><button class="u" data-d="up">▲</button><button class="d" data-d="down">▼</button><button class="l" data-d="left">◀</button><button class="r" data-d="right">▶</button></div>
<button class="gb" id="abtn">A</button><button class="gb" id="mbtn">MAP</button>
<script src="world.js?v=6"></script>
<script src="game.js?v=6"></script>
</body>
</html>
